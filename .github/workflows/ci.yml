name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt
      # slug.arcade builds its vendored raylib against X11 and OpenGL.
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl-dev
      - run: make stage-native-clutches
      - run: make ci

  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - run: make test-native
      - name: Test the typed filesystem clutch through the CLI
        run: make test-filesystem-clutch

  # The native tier on Windows, where it stays off by default until this
  # passes: the tier's own tests, the slug suite interpreted as a baseline,
  # then with hot chunks compiled in the background, then with every chunk
  # compiled at its first entry. Each step runs even when an earlier one
  # fails, so a failure shows which layer breaks.
  native-tier-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      # The clutches with a Windows build, which the suite imports from
      # this checkout: slug.db.sqlite needs a system SQLite, and
      # slug.net.tcp is not ported yet.
      - name: Stage the native clutches that build on Windows
        run: sh scripts/stage-native-clutches.sh slug.core.clutch slug.crypto.clutch slug.random.secure.clutch slug.io.fs.clutch
      - name: The tier's own tests and differential tests
        run: make test-native-tier
      - name: The slug suite, interpreted
        if: success() || failure()
        run: SLUG_NATIVE=off cargo test -p slug --features metrics --tests --bins
      - name: The slug suite, hot chunks compiled
        if: success() || failure()
        run: SLUG_NATIVE=on cargo test -p slug --features metrics --tests --bins
      - name: The slug suite, every chunk compiled
        if: success() || failure()
        run: SLUG_NATIVE=all cargo test -p slug --features native,metrics --tests --bins

  # The fork fixtures under ThreadSanitizer, with std rebuilt for it.
  thread-sanitizer:
    runs-on: ubuntu-latest
    env:
      SLUG_TSAN_TOOLCHAIN: nightly-2026-11-07
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-07
          components: rust-src
      # ThreadSanitizer cannot map its shadow memory with the runner's
      # default address-space randomization.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: python3 -I scripts/tsan-forks.py --runs 3

  embedded-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust for ESP32-S3
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          buildtargets: esp32s3
      - name: Check ESP32-S3 firmware
        run: cargo +esp check
        working-directory: firmware/slug-esp32-s3
      - name: Check ESP32-S3 firmware with a typed C provider
        run: cargo +esp check
        working-directory: firmware/slug-esp32-s3
        env:
          SLUG_TARGET_DESCRIPTOR: esp32-s3-typed.toml
      - name: Check ESP32-S3 firmware with tasks
        run: cargo +esp check
        working-directory: firmware/slug-esp32-s3
        env:
          SLUG_TARGET_DESCRIPTOR: esp32-s3-tasks.toml
      - name: Check slug-vm with tasks for ESP32-S3
        run: cargo +esp check -p slug-vm --no-default-features --features concurrency,metrics --target xtensa-esp32s3-none-elf -Z build-std=core,alloc
      - name: Check the typed native adapter for ESP32-S3
        run: cargo +esp check -p slug-native-adapter --target xtensa-esp32s3-none-elf -Z build-std=core,alloc
