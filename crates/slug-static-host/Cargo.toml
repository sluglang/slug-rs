[package]
name = "slug-static-host"
version.workspace = true
edition = "2024"
rust-version = "1.96.1"
description = "Static Slug module contracts for selected hosts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/babyman/slug-rs"

[lints]
workspace = true

[features]
default = ["concurrency"]
# `slug.time.sleepMs` waits on the VM's timers.
concurrency = ["slug-frontend/concurrency", "slug-vm/concurrency"]

[dependencies]
slug-frontend = { path = "../slug-frontend", default-features = false }
slug-loader = { path = "../slug-loader" }
slug-vm = { path = "../slug-vm", default-features = false }
